site_name: Fieldbook
site_url: https://harsh-jain02.github.io/fieldbook/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - MkDocs:
      - Quick steps: mkdocs/quick-steps.md
      - Full guide: mkdocs/full-guide.md
  - Coding agents:
      - Codex Slack notifications: coding-agents/codex-slack-notifications.md

  # - Getting Started:
  #     - Installation: installation.md

  # - Architecture: architecture.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
