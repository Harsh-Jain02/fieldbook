site_name: My Documentation
site_url: https://harsh-jain02.github.io/fieldbook/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - How to make an MkDocs website: how-to-make-mkdocs-website.md

  # - Getting Started:
  #     - Installation: installation.md

  # - Architecture: architecture.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
